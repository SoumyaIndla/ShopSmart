spring.application.name=ShopSmart
server.port=8080

# Set these in your environment before connecting to a real database.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/shopsmart_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Replace this development key with a long, random secret outside local development.
shopsmart.jwt.secret=${JWT_SECRET:ShopSmart-local-dev-key-change-before-production-2026}
shopsmart.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
shopsmart.admin.email=admin@shopsmart.com
