spring.application.name=ShopSmart
server.port=${PORT:8080}
server.address=0.0.0.0
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript

# Local development values live in .env (git-ignored).
# Deployments (Render/Docker) provide these as real environment variables.
spring.config.import=optional:file:.env[.properties]

# Comma-separated frontend origins allowed to call the API.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/shopsmart_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

shopsmart.jwt.secret=${JWT_SECRET}
shopsmart.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

shopsmart.admin.email=${ADMIN_EMAIL:admin@shopsmart.com}
shopsmart.admin.password=${ADMIN_PASSWORD:}

razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}
